version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: wildvogelreha-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: wildvogelreha
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Port NICHT nach außen freigeben - nur intern erreichbar
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wildvogelreha-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:18-alpine
    container_name: wildvogelreha-backend
    restart: always
    working_dir: /app
    volumes:
      - ./src/server:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: sh -c "npm install && node server.js"
    networks:
      - wildvogelreha-network

  frontend:
    image: nginx:alpine
    container_name: wildvogelreha-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - wildvogelreha-network

  # Certbot für automatische SSL-Zertifikate
  certbot:
    image: certbot/certbot
    container_name: wildvogelreha-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  db_data:
    driver: local

networks:
  wildvogelreha-network:
    driver: bridge
