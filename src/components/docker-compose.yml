version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: wildvogelreha-db
    environment:
      MYSQL_ROOT_PASSWORD: your_root_password
      MYSQL_DATABASE: wildvogelreha
      MYSQL_USER: wildvogelreha_user
      MYSQL_PASSWORD: your_db_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wildvogelreha-network

  backend:
    image: node:18-alpine
    container_name: wildvogelreha-backend
    working_dir: /app
    volumes:
      - ./src/server:/app
    environment:
      DB_HOST: db
      DB_USER: wildvogelreha_user
      DB_PASSWORD: your_db_password
      DB_NAME: wildvogelreha
      DB_PORT: 3306
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: npm install && npm start
    networks:
      - wildvogelreha-network

  frontend:
    image: nginx:alpine
    container_name: wildvogelreha-frontend
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    networks:
      - wildvogelreha-network

volumes:
  db_data:

networks:
  wildvogelreha-network:
    driver: bridge